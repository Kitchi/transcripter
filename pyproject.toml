[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Local, bot-free meeting transcription: system audio + mic capture, whisperX transcription, local summarization."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "mlx-whisper>=0.4 ; sys_platform == 'darwin'",
]

[project.scripts]
meeting-recorder = "meeting_recorder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_recorder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
